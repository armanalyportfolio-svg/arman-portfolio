<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D3550"/>
      <stop offset="1" stop-color="#1D1826"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBD8E3"/>
    </linearGradient>
    <path id="a" fill-rule="evenodd" d="M30 11 L49 53 H40.6 L36.9 44.6 H23.1 L19.4 53 H11 Z M26.1 37.6 H33.9 L30 28.4 Z"/>
    <!-- everything except the glitched band -->
    <mask id="noBand">
      <rect width="64" height="64" fill="#fff"/>
      <rect y="40" width="64" height="4.5" fill="#000"/>
    </mask>
    <clipPath id="band"><rect y="40" width="64" height="4.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- subtle RGB-split ghosts -->
  <use href="#a" fill="#ff2a6d" opacity="0.75" transform="translate(-1.6 0)"/>
  <use href="#a" fill="#05d9e8" opacity="0.75" transform="translate(1.6 0)"/>
  <!-- letter with one band shifted sideways, like a glitch frame -->
  <use href="#a" fill="url(#fg)" mask="url(#noBand)"/>
  <use href="#a" fill="url(#fg)" clip-path="url(#band)" transform="translate(3 0)"/>
  <!-- the dot from the "Arman." logo -->
  <circle cx="55" cy="50.2" r="3.3" fill="#9F97AD"/>
</svg>
